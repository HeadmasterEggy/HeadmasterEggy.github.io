<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识图谱 | Joey</title>
<meta name="pjax" content="false">
<style>
  :root {
    --bg: #060e1a;
    --bg-2: #0b1526;
    --panel: rgba(10, 20, 36, 0.86);
    --panel-solid: #0c1728;
    --border: rgba(255, 255, 255, 0.09);
    --border-soft: rgba(255, 255, 255, 0.05);
    --text: #eaf1ff;
    --muted: #93a5c0;
    --soft: #64789b;
    --accent: #6fb0ff;
    --accent-2: #7fe9c8;
    --radius: 14px;
    --radius-sm: 9px;
    --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    font-size: 13px;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    -webkit-font-smoothing: antialiased;
  }

  /* 背景光晕画在 body 上，是静态的，不会随图谱重绘 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(60% 50% at 18% 8%, rgba(84, 152, 255, 0.16), transparent 70%),
      radial-gradient(50% 45% at 85% 12%, rgba(94, 235, 195, 0.10), transparent 70%),
      radial-gradient(70% 60% at 50% 100%, rgba(122, 96, 255, 0.12), transparent 70%);
  }

  #graph {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: block;
    cursor: grab;
    touch-action: none;
  }
  #graph.grabbing { cursor: grabbing; }
  #graph.pointing { cursor: pointer; }

  /* ---------- 面板 ---------- */
  .panel {
    position: fixed;
    z-index: 3;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    /* 只做轻量模糊：面板下方是持续重绘的 canvas，大半径 backdrop-filter 会拖垮合成 */
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .panel-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 13px;
    border-bottom: 1px solid var(--border-soft);
  }
  .panel-head .brand {
    font-size: 13.5px;
    font-weight: 650;
    letter-spacing: 0.2px;
    flex: 1;
  }
  .panel-head .brand small {
    display: block;
    font-weight: 400;
    font-size: 11px;
    color: var(--soft);
    margin-top: 2px;
  }

  .icon-btn {
    width: 24px;
    height: 24px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    color: var(--muted);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.1); color: var(--text); }

  /* 左上主面板 */
  #panel-left {
    top: 16px;
    left: 16px;
    width: 296px;
  }
  #panel-left .panel-body { padding: 12px 13px 13px; }
  #panel-left.collapsed .panel-body { display: none; }

  .search-wrap { position: relative; }
  .search-wrap input {
    width: 100%;
    padding: 9px 52px 9px 30px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: rgba(4, 10, 20, 0.6);
    color: var(--text);
    font-size: 12.5px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search-wrap input::placeholder { color: var(--soft); }
  .search-wrap input:focus {
    border-color: rgba(111, 176, 255, 0.55);
    box-shadow: 0 0 0 3px rgba(111, 176, 255, 0.12);
  }
  .search-wrap .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--soft);
    font-size: 12px;
    pointer-events: none;
  }
  .search-wrap .search-count {
    position: absolute;
    right: 9px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    color: var(--soft);
    pointer-events: none;
  }

  .chips-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .chip-btn {
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    color: var(--muted);
    font-size: 11.5px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .chip-btn:hover { background: rgba(255, 255, 255, 0.1); color: var(--text); }
  .chip-btn.on {
    background: rgba(111, 176, 255, 0.18);
    border-color: rgba(111, 176, 255, 0.45);
    color: #cfe4ff;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 11px;
  }
  .stat {
    padding: 7px 4px;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-soft);
    text-align: center;
  }
  .stat .value { display: block; font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat .label { display: block; font-size: 10px; color: var(--soft); margin-top: 1px; }

  /* 右侧标签页面板 */
  #panel-right {
    top: 16px;
    right: 16px;
    width: 316px;
    /* 底部给缩放控件留出位置 */
    max-height: calc(100vh - 84px);
    display: flex;
    flex-direction: column;
  }
  #panel-right.collapsed { max-height: none; }
  #panel-right.collapsed .tabs,
  #panel-right.collapsed .tab-body { display: none; }

  .tabs {
    display: flex;
    gap: 2px;
    padding: 8px 8px 0;
    border-bottom: 1px solid var(--border-soft);
    flex: none;
  }
  .tab {
    flex: 1;
    padding: 7px 4px 9px;
    border: 0;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: var(--soft);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab:hover { color: var(--muted); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  .tab-body {
    padding: 13px;
    overflow-y: auto;
    overscroll-behavior: contain;
    flex: 1 1 auto;
    min-height: 0;
  }
  .tab-body::-webkit-scrollbar { width: 8px; }
  .tab-body::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  .tab-body::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); background-clip: content-box; }

  .empty-hint {
    color: var(--soft);
    font-size: 12px;
    line-height: 1.7;
    padding: 18px 4px;
    text-align: center;
  }

  /* 详情 */
  .node-title { margin: 0 0 9px; font-size: 15px; line-height: 1.45; font-weight: 650; }
  .meta-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .chip {
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border-soft);
    color: var(--muted);
    font-size: 10.5px;
  }
  .chip.dot::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: 0;
    background: var(--dot, var(--accent));
  }
  .excerpt {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.72;
    margin-bottom: 12px;
    padding-left: 9px;
    border-left: 2px solid rgba(111, 176, 255, 0.3);
  }
  .detail-actions { display: flex; gap: 6px; margin-bottom: 12px; }
  .btn {
    flex: 1;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.1); }
  .btn.primary {
    background: linear-gradient(135deg, rgba(111, 176, 255, 0.9), rgba(127, 233, 200, 0.75));
    border-color: transparent;
    color: #05121f;
    font-weight: 600;
  }
  .btn.primary:hover { filter: brightness(1.08); }

  .detail-line {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 0;
    border-top: 1px solid var(--border-soft);
    font-size: 11.5px;
  }
  .detail-line > span:first-child { color: var(--soft); flex: none; }
  .detail-line > span:last-child { color: var(--muted); text-align: right; word-break: break-all; }

  .section-title {
    font-size: 11px;
    color: var(--soft);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin: 14px 0 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .neighbors { display: flex; flex-direction: column; gap: 4px; }
  .neighbor {
    text-align: left;
    padding: 7px 9px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft);
    background: rgba(255, 255, 255, 0.03);
    color: var(--muted);
    font-size: 11.5px;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: background 0.15s, color 0.15s;
  }
  .neighbor:hover { background: rgba(111, 176, 255, 0.14); color: var(--text); }
  .neighbor .swatch { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .neighbor .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 筛选 */
  .legend-list { display: flex; flex-direction: column; gap: 3px; }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    user-select: none;
    transition: background 0.12s;
  }
  .legend-item:hover { background: rgba(255, 255, 255, 0.05); }
  .legend-item.off { opacity: 0.35; }
  .legend-item .swatch { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .legend-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-item .num { font-size: 10.5px; color: var(--soft); font-variant-numeric: tabular-nums; }

  /* 设置 */
  .setting-group { margin-bottom: 15px; }
  .setting-group > .gname {
    font-size: 11px;
    color: var(--soft);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 9px;
  }
  .setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .setting-value { color: var(--text); font-size: 11px; font-variant-numeric: tabular-nums; }
  .range-input {
    width: 100%;
    height: 3px;
    margin: 0 0 12px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255, 255, 255, 0.14);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  .range-input::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #0a1526;
    cursor: pointer;
  }
  .range-input::-moz-range-thumb {
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #0a1526;
    cursor: pointer;
  }
  .switch-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 11px;
  }
  .switch { position: relative; width: 34px; height: 19px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider {
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.14);
    border-radius: 999px;
    transition: background 0.18s;
  }
  .switch .slider::before {
    content: "";
    position: absolute;
    width: 15px; height: 15px;
    left: 2px; top: 2px;
    background: #dfe9f8;
    border-radius: 50%;
    transition: transform 0.18s;
  }
  .switch input:checked + .slider { background: rgba(111, 176, 255, 0.7); }
  .switch input:checked + .slider::before { transform: translateX(15px); }

  /* 底部条 */
  .footbar {
    position: fixed;
    left: 16px;
    bottom: 16px;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
    max-width: calc(100vw - 32px);
  }
  .footbar .hint {
    font-size: 11px;
    color: var(--soft);
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(10, 20, 36, 0.7);
    border: 1px solid var(--border-soft);
  }
  #fps {
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--accent-2);
    padding: 5px 9px;
    border-radius: 999px;
    background: rgba(10, 20, 36, 0.7);
    border: 1px solid var(--border-soft);
  }

  /* 悬浮提示 */
  .tooltip {
    position: fixed;
    z-index: 5;
    display: none;
    max-width: 300px;
    padding: 9px 11px;
    border-radius: 10px;
    background: rgba(6, 13, 24, 0.96);
    border: 1px solid var(--border);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    pointer-events: none;
    font-size: 12px;
    line-height: 1.5;
  }
  .tooltip .mini { color: var(--soft); font-size: 11px; margin-top: 4px; }

  .tooltip.show { animation: tip-in 0.16s ease-out; }
  .tooltip strong { display: flex; align-items: center; gap: 7px; }
  .tooltip .tip-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor; }
  @keyframes tip-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* 面板入场：开场时从边缘滑入，错开一点点 */
  .panel.enter, .footbar.enter, .zoom-ctrl.enter {
    animation: panel-in 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    animation-delay: var(--delay, 0s);
  }
  #panel-right.enter { --from-x: 18px; }
  .footbar.enter, .zoom-ctrl.enter { --from-y: 12px; }
  @keyframes panel-in {
    from { opacity: 0; transform: translate(var(--from-x, -18px), var(--from-y, 0)); }
    to { opacity: 1; transform: none; }
  }

  /* 右下角缩放控件 */
  .zoom-ctrl {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border-radius: 12px;
    background: rgba(10, 20, 36, 0.78);
    border: 1px solid var(--border-soft);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
  }
  .zoom-ctrl button {
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-size: 15px;
    line-height: 1;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .zoom-ctrl button:hover { background: rgba(255, 255, 255, 0.09); color: var(--text); }
  .zoom-ctrl .zoom-val {
    min-width: 44px;
    text-align: center;
    font-size: 11px;
    color: var(--soft);
    font-variant-numeric: tabular-nums;
  }
  .zoom-ctrl .sep { width: 1px; height: 16px; background: var(--border); margin: 0 3px; }

  kbd {
    display: inline-block;
    min-width: 16px;
    padding: 0 4px;
    margin: 0 1px;
    border-radius: 4px;
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--muted);
    font: 10px/14px ui-monospace, SFMono-Regular, Menlo, monospace;
    text-align: center;
  }

  /* ---------- 加载：一个小星系在转，连线一闪一闪地“编织” ---------- */
  #loading {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 16px;
    background:
      radial-gradient(40% 35% at 50% 45%, rgba(84, 152, 255, 0.10), transparent 70%),
      var(--bg);
    text-align: center;
    transition: opacity 0.6s ease, transform 0.6s ease, filter 0.6s ease;
  }
  #loading.done {
    opacity: 0;
    transform: scale(1.06);
    filter: blur(6px);
    pointer-events: none;
  }
  .loader-orbit { width: 132px; height: 132px; margin-bottom: 4px; }
  .loader-orbit svg { width: 100%; height: 100%; overflow: visible; }
  .loader-orbit .orbit-path { fill: none; stroke: rgba(255, 255, 255, 0.07); stroke-width: 0.8; }
  .loader-orbit .spin { animation: spin 9s linear infinite; }
  .loader-orbit .spin.s2 { animation-duration: 6.5s; animation-direction: reverse; }
  .loader-orbit .spin.s3 { animation-duration: 14s; }
  .loader-orbit .ray {
    stroke: rgba(150, 200, 255, 0.55);
    stroke-width: 0.9;
    stroke-linecap: round;
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
    animation: weave 2.4s ease-in-out infinite;
    animation-delay: var(--d, 0s);
  }
  .loader-orbit .sat { animation: twinkle 2.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .loader-orbit .core { fill: #dff0ff; }
  .loader-orbit .core-glow { animation: breathe 2.4s ease-in-out infinite; transform-origin: 0 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes weave {
    0% { stroke-dashoffset: 60; opacity: 0; }
    35% { stroke-dashoffset: 0; opacity: 1; }
    70% { stroke-dashoffset: 0; opacity: 0.8; }
    100% { stroke-dashoffset: -60; opacity: 0; }
  }
  @keyframes twinkle { 0%, 100% { opacity: 0.45; } 40% { opacity: 1; } }
  @keyframes breathe { 0%, 100% { transform: scale(0.85); opacity: 0.7; } 50% { transform: scale(1.15); opacity: 1; } }

  #loading .title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #8fa5c6 0%, #ffffff 45%, #8fa5c6 90%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 2.6s linear infinite;
  }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  #loading .bar {
    position: relative;
    width: 220px;
    height: 4px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  #loading .bar i {
    position: relative;
    display: block;
    height: 100%;
    width: 0%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 12px rgba(127, 233, 200, 0.55);
    transition: width 0.25s ease-out;
    overflow: hidden;
  }
  #loading .bar i::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
    transform: translateX(-100%);
    animation: sweep 1.3s ease-in-out infinite;
  }
  @keyframes sweep { to { transform: translateX(100%); } }
  #loading .step {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    width: 220px;
    font-size: 11.5px;
    color: var(--soft);
  }
  #loading .step #loading-pct { color: var(--muted); font-variant-numeric: tabular-nums; }
  #loading .step-text { transition: opacity 0.2s; }
  #loading .step-text.swap { opacity: 0; }
  #loading.failed .loader-orbit, #loading.failed .bar, #loading.failed .step { display: none; }
  #loading.failed .title { animation: none; color: #ffb4b4; -webkit-text-fill-color: #ffb4b4; }
  .load-error { max-width: 320px; color: var(--muted); font-size: 12px; line-height: 1.7; }
  .load-error .btn { margin-top: 12px; flex: none; padding: 8px 22px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; }
    .loader-orbit .ray { stroke-dashoffset: 0; opacity: 0.6; }
  }

  @media (max-width: 900px) {
    #panel-left, #panel-right {
      width: auto;
      left: 12px;
      right: 12px;
    }
    #panel-left { top: 12px; }
    #panel-right {
      top: auto;
      bottom: 12px;
      max-height: 45vh;
    }
    .footbar, .zoom-ctrl { display: none !important; }
  }
</style>
</head>

<body>

<canvas id="graph"></canvas>

<div id="loading" role="status" aria-live="polite">
  <div class="loader-orbit" aria-hidden="true">
    <svg viewBox="-66 -66 132 132">

<script>
/* ============================================================
   知识图谱 · 3D Canvas 版
   节点在三维空间里做力学布局，用一台透视相机画到 2D Canvas 上：
   拖动背景旋转，Shift / 右键拖动平移，滚轮或双指缩放，拖动节点挪位置。
   远处的节点更小、更暗（雾化），近处的盖住远处的。
   “3D”开关关掉后把 z 轴压平、相机转回正面，就是原来的平面图谱。
   不再依赖 d3：力学、相机和交互都在这一个文件里，CDN 挂了也能开。
   ============================================================ */

const DEFAULTS = {
  arrows: false,
  showFps: false,
  textOpacity: 88,
  nodeScale: 100,
  lineWidth: 100,
  centerStrength: 12,
  chargeStrength: 130,
  linkStrength: 78,
  linkDistance: 82,
  autoRotate: true,
  flat: false
};

const PALETTE = ['#7bb8ff','#8be6cd','#ffcc73','#ff9f9f','#bda1ff','#78d8ff','#ffd1a8','#9be1a0','#f3b4d9','#b4c2ff','#9af0ff','#ffc4c4','#d0f4de','#f8d39b','#d6c2ff'];
const WARMUP_TICKS = 300;      // 开场先在后台跑完这些步，打开时布局已经成形
const LABEL_MIN_SCALE = 0.42;  // 普通笔记标题的最小缩放级别（大类标题不受限制）
const LABEL_BUDGET = 140;      // 一帧最多画多少个标签
const HOME_VIEW = { yaw: 0.62, pitch: 0.34 };   // 默认的观察角度
const SPIN_SPEED = 0.00011;    // 自动旋转，弧度 / 毫秒（约一分钟转一圈）

function loadSettings() {
  try {
    const raw = window.localStorage.getItem('joey-graph-settings');
    return raw ? Object.assign({}, DEFAULTS, JSON.parse(raw)) : Object.assign({}, DEFAULTS);
  } catch (e) {
    return Object.assign({}, DEFAULTS);
  }
}

const state = {
  hiddenCategories: new Set(),
  showHelpers: true,
  showLabels: false,
  selectedId: null,
  hoveredId: null,
  searchQuery: '',
  settings: loadSettings()
};

const $ = id => document.getElementById(id);
const truncate = (s, n) => !s ? '' : (s.length > n ? s.slice(0, n) + '…' : s);
const escapeHtml = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const typeLabel = (type, synthetic) => type === 'hub' ? (synthetic ? '大类节点' : '大类文档') : '笔记';

const REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

let lastStepText = '';
function setProgress(pct, text) {
  pct = Math.max(0, Math.min(100, pct));
  $('loading-bar').style.width = pct + '%';
  $('loading-pct').textContent = Math.round(pct) + '%';
  if (text && text !== lastStepText) {
    lastStepText = text;
    const el = $('loading-step');
    el.classList.add('swap');
    setTimeout(() => { el.textContent = text; el.classList.remove('swap'); }, 120);
  }
}

function showLoadError(message) {
  const box = $('loading');
  box.classList.add('failed');
  $('loading-title').textContent = '图谱没能加载出来';
  const err = $('loading-error');
  err.hidden = false;
  err.innerHTML = escapeHtml(message) +
    '<br><button class="btn primary" id="loading-retry">重新加载</button>';
  $('loading-retry').addEventListener('click', () => window.location.reload());
}

// 在下一帧继续；后台标签页里 rAF 会被节流，所以再挂一个 setTimeout 兜底，谁先到用谁
function nextFrame(fn) {
  let done = false;
  const go = () => { if (!done) { done = true; fn(); } };
  requestAnimationFrame(go);
  setTimeout(go, 60);
}

setProgress(8, '读取节点数据…');
// 每次部署 data.json 都会变，用 no-cache 让浏览器带 ETag 回源校验，避免拿到旧图谱
fetch('./data.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(graph => {
    setProgress(30, '计算布局…');
    let started = false;
    const go = () => {
      if (started) return;
      started = true;
      try { start(graph); }
      catch (err) { console.error(err); showLoadError('加载失败：' + (err && err.message ? err.message : err)); }
    };
    requestAnimationFrame(() => requestAnimationFrame(go));
    setTimeout(go, 120);
  })
  .catch(err => {
    console.error(err);
    showLoadError('加载失败：' + (err && err.message ? err.message : err));
  });


function start(graph) {
  /* ---------- 基础索引 ---------- */
  const categoryColor = {};
  graph.categories.forEach((c, i) => categoryColor[c] = PALETTE[i % PALETTE.length]);
  const colorOf = n => categoryColor[n.category] || '#9fb0ca';

  const nodes = graph.nodes;
  const byId = new Map(nodes.map(n => [n.id, n]));
  const neighbors = new Map(nodes.map(n => [n.id, new Set()]));
  // 连线两端换成节点对象（以前是 d3.forceLink 替我们做的）
  graph.edges = graph.edges
    .map(e => Object.assign(e, { source: byId.get(e.source) || e.source, target: byId.get(e.target) || e.target }))
    .filter(e => e.source && e.target && typeof e.source === 'object' && typeof e.target === 'object' && e.source !== e.target);
  const edges = graph.edges;
  const linkCount = new Map(nodes.map(n => [n.id, 0]));
  edges.forEach(e => {
    neighbors.get(e.source.id).add(e.target.id);
    neighbors.get(e.target.id).add(e.source.id);
    linkCount.set(e.source.id, linkCount.get(e.source.id) + 1);
    linkCount.set(e.target.id, linkCount.get(e.target.id) + 1);
  });
  edges.forEach(e => {
    const a = linkCount.get(e.source.id), b = linkCount.get(e.target.id);
    e._bias = a / (a + b);
  });
  // 搜索用的小写串预先算好，别在每次 hover 时重复 join+toLowerCase
  nodes.forEach(n => {
    n._hay = [n.title, n.path, n.category].concat(n.tags || []).join(' ').toLowerCase();
    n.vx = n.vy = n.vz = 0;
    n.fx = null;
    n.sx = n.sy = n.d = 0; n.s = 1;
  });

  const canvas = $('graph');
  const ctx = canvas.getContext('2d', { alpha: true });
  let width = 0, height = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = Math.max(1, window.innerWidth || 0);
    height = Math.max(1, window.innerHeight || 0);
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    dirty = true;
  }

  const isFlat = () => !!state.settings.flat;

  function nodeRadius(d) {
    const base = d.type === 'hub' ? 11 : 5;
    return (base + Math.min(11, Math.sqrt(d.degree || 0) * 1.8)) * (state.settings.nodeScale / 100);
  }

  /* ---------- 力学（三维） ----------
     和以前 d3-force 的四种力一样：斥力、连线弹簧、向心力、碰撞，只是多了一个 z。
     三百来个节点两两算一遍斥力也就四万多对，一帧不到一毫秒。 */
  let alpha = 1, alphaTarget = 0, alphaDecay = 0.0228;
  const ALPHA_MIN = 0.001;

  function tick() {
    const s = state.settings;
    const flat = isFlat();
    const n = nodes.length;
    const charge = s.chargeStrength * alpha;
    for (let i = 0; i < n; i++) {
      const a = nodes[i];
      const ra = nodeRadius(a) + 10;
      const qa = a.type === 'hub' ? 0.82 : 1;
      for (let j = i + 1; j < n; j++) {
        const b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z;
        let d2 = dx * dx + dy * dy + dz * dz;
        if (d2 > 360000) continue;
        if (d2 < 1) {
          dx = Math.random() - 0.5; dy = Math.random() - 0.5; dz = flat ? 0 : Math.random() - 0.5;
          d2 = dx * dx + dy * dy + dz * dz + 0.01;
        }
        const qb = b.type === 'hub' ? 0.82 : 1;
        const fa = charge * qb / d2, fb = charge * qa / d2;
        a.vx += dx * fa; a.vy += dy * fa; a.vz += dz * fa;
        b.vx -= dx * fb; b.vy -= dy * fb; b.vz -= dz * fb;
        // 碰撞：两个节点叠在一起时直接推开
        const rr = ra + nodeRadius(b) + 10;
        if (d2 < rr * rr) {
          const d = Math.sqrt(d2);
          const push = (rr - d) / d * 0.35;
          a.vx += dx * push; a.vy += dy * push; a.vz += dz * push;
          b.vx -= dx * push; b.vy -= dy * push; b.vz -= dz * push;
        }
      }
    }
    const ls = s.linkStrength / 100, ld = s.linkDistance / 100;
    for (let i = 0; i < edges.length; i++) {
      const e = edges[i], a = e.source, b = e.target;
      const dx = (b.x + b.vx) - (a.x + a.vx) || 1e-6, dy = (b.y + b.vy) - (a.y + a.vy) || 1e-6, dz = (b.z + b.vz) - (a.z + a.vz);
      const l = Math.sqrt(dx * dx + dy * dy + dz * dz);
      const dist = (e.kind === 'hub' ? 58 : 86) * ld;
      const str = (e.kind === 'hub' ? 0.65 : 0.85) * ls;
      const f = (l - dist) / l * alpha * str;
      b.vx -= dx * f * e._bias; b.vy -= dy * f * e._bias; b.vz -= dz * f * e._bias;
      a.vx += dx * f * (1 - e._bias); a.vy += dy * f * (1 - e._bias); a.vz += dz * f * (1 - e._bias);
    }
    const cs = s.centerStrength / 200 * alpha;
    let far = 0;
    for (let i = 0; i < n; i++) {
      const p = nodes[i];
      p.vx -= p.x * cs; p.vy -= p.y * cs; p.vz -= p.z * cs;
      if (p.fx) {
        p.x = p.fx[0]; p.y = p.fx[1]; p.z = p.fx[2];
        p.vx = p.vy = p.vz = 0;
      } else {
        p.vx *= 0.6; p.vy *= 0.6; p.vz *= 0.6;
        p.x += p.vx; p.y += p.vy; p.z += p.vz;
      }
      if (flat) { p.vz = 0; p.z *= 0.82; if (Math.abs(p.z) < 0.05) p.z = 0; }
      if (!Number.isFinite(p.x + p.y + p.z)) { p.x = Math.random() * 10; p.y = Math.random() * 10; p.z = 0; p.vx = p.vy = p.vz = 0; }
      const r = Math.sqrt(p.x * p.x + p.y * p.y + p.z * p.z);
      if (r > far) far = r;
    }
    spread += (Math.max(far, 160) - spread) * 0.08;
    alpha += (alphaTarget - alpha) * alphaDecay;
  }

  /* 按类别把节点撒开再开跑：每个大类在一个球面上占一个点（斐波那契球），
     同类的笔记围着它撒成一个小球，收敛快，最终同类天然抱团 */
  function seedLayout() {
    const groups = new Map();
    nodes.forEach(n => {
      if (!groups.has(n.category)) groups.set(n.category, []);
      groups.get(n.category).push(n);
    });
    const keys = [...groups.keys()];
    const flat = isFlat();
    const R = 60 + keys.length * (flat ? 26 : 15);
    const golden = Math.PI * (3 - Math.sqrt(5));
    keys.forEach((key, gi) => {
      const list = groups.get(key);
      let cx, cy, cz;
      if (flat) {
        const a = (gi / keys.length) * Math.PI * 2;
        cx = Math.cos(a) * R; cy = Math.sin(a) * R; cz = 0;
      } else {
        const u = 1 - 2 * (gi + 0.5) / keys.length, w = Math.sqrt(1 - u * u), t = gi * golden;
        cx = Math.cos(t) * w * R; cy = u * R; cz = Math.sin(t) * w * R;
      }
      const r = 24 + Math.sqrt(list.length) * (flat ? 15 : 11);
      list.forEach((n, i) => {
        if (n.type === 'hub') { n.x = cx; n.y = cy; n.z = cz; return; }
        if (flat) {
          const t = (i / Math.max(1, list.length)) * Math.PI * 2;
          n.x = cx + Math.cos(t) * r; n.y = cy + Math.sin(t) * r; n.z = 0;
        } else {
          const u = 1 - 2 * (i + 0.5) / list.length, w = Math.sqrt(1 - u * u), t = i * golden;
          n.x = cx + Math.cos(t) * w * r; n.y = cy + u * r; n.z = cz + Math.sin(t) * w * r;
        }
      });
    });
  }

  let spread = 300;
  seedLayout();

  /* 预热分批跑：每帧最多占 12ms，进度条和加载动画不会卡住 */
  function runWarmup(done) {
    alpha = 1; alphaTarget = 0;
    alphaDecay = 1 - Math.pow(0.001, 1 / WARMUP_TICKS);
    let i = 0;
    const chunk = () => {
      const t0 = performance.now();
      while (i < WARMUP_TICKS && performance.now() - t0 < 12) { tick(); i++; }
      setProgress(30 + 55 * (i / WARMUP_TICKS), i < WARMUP_TICKS * 0.6 ? '计算布局…' : '让节点在空间里各就各位…');
      if (i < WARMUP_TICKS) nextFrame(chunk);
      else { alphaDecay = 0.0228; done(); }
    };
    chunk();
  }

  /* ---------- 相机 ----------
     先绕 y 轴转 yaw，再绕 x 轴转 pitch；d 是离观察者的深度（越大越远）。
     相机对着“转动中心” (tx, ty, tz)，站在它前方 focal 处；k 是缩放，
     (ox, oy) 是转动中心在屏幕上相对画布中心的偏移（给两侧面板让位置）。 */
  const cam = {
    yaw: isFlat() ? 0 : HOME_VIEW.yaw,
    pitch: isFlat() ? 0 : HOME_VIEW.pitch,
    tx: 0, ty: 0, tz: 0, k: 1, ox: 0, oy: 0
  };
  const focal = () => spread * 2.4;

  function project() {
    const cyw = Math.cos(cam.yaw), syw = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const F = focal(), cx = width / 2 + cam.ox, cy = height / 2 + cam.oy, k = cam.k;
    for (let i = 0; i < nodes.length; i++) {
      const p = nodes[i];
      const x = p.x - cam.tx, y = p.y - cam.ty, z = p.z - cam.tz;
      const x1 = x * cyw + z * syw, z1 = -x * syw + z * cyw;
      const y2 = y * cp - z1 * sp, d = y * sp + z1 * cp;
      const s = F / Math.max(F + d, F * 0.1);
      p.d = d; p.s = s;
      p.sx = cx + x1 * s * k;
      p.sy = cy + y2 * s * k;
    }
  }
  // 屏幕上的一段位移（缩放前、转动中心那一层的单位）换算成世界坐标里的位移
  function unrotate(x1, y2) {
    const cyw = Math.cos(cam.yaw), syw = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const y = y2 * cp, z1 = -y2 * sp;
    return [x1 * cyw - z1 * syw, y, x1 * syw + z1 * cyw];
  }
  // 屏幕点 (px, py) 在深度 d 处对应的世界坐标：拖动节点时用
  function unproject(px, py, d) {
    const F = focal(), s = F / Math.max(F + d, F * 0.1);
    const x1 = (px - width / 2 - cam.ox) / cam.k / s, y2 = (py - height / 2 - cam.oy) / cam.k / s;
    const cyw = Math.cos(cam.yaw), syw = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const y = y2 * cp + d * sp, z1 = -y2 * sp + d * cp;
    return [x1 * cyw - z1 * syw + cam.tx, y + cam.ty, x1 * syw + z1 * cyw + cam.tz];
  }
  function panBy(dx, dy) {
    const [x, y, z] = unrotate(-dx / cam.k, -dy / cam.k);
    cam.tx += x; cam.ty += y; cam.tz += z;
  }
  // 缩放到 k，同时让指针下的那一点留在原地
  function zoomAt(px, py, k) {
    k = Math.max(0.05, Math.min(6, k));
    const ux = (px - width / 2 - cam.ox) / cam.k, uy = (py - height / 2 - cam.oy) / cam.k;
    const f = 1 - cam.k / k;
    const [x, y, z] = unrotate(ux * f, uy * f);
    cam.tx += x; cam.ty += y; cam.tz += z; cam.k = k;
    dirty = true;
  }

  /* 相机补间：适配视图、聚焦节点、切换 3D/平面都走这里；用户一动手就停 */
  let camTween = null;
  const wrapAngle = a => Math.atan2(Math.sin(a), Math.cos(a));
  const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function animateCam(goal, dur) {
    if (REDUCED_MOTION || !dur) { Object.assign(cam, goal); camTween = null; dirty = true; return; }
    const from = Object.assign({}, cam);
    if ('yaw' in goal) goal.yaw = from.yaw + wrapAngle(goal.yaw - from.yaw);
    camTween = { from, goal, t0: performance.now(), dur };
    dirty = true;
  }
  function stepCam(now) {
    if (!camTween) return false;
    const t = Math.min(1, (now - camTween.t0) / camTween.dur), e = easeInOut(t);
    for (const key in camTween.goal) cam[key] = camTween.from[key] + (camTween.goal[key] - camTween.from[key]) * e;
    if (t >= 1) camTween = null;
    return true;
  }

  /* ---------- 可见性 / 聚焦 ---------- */
  function isVisible(n) {
    if (!state.showHelpers && n.type === 'hub') return false;
    return !state.hiddenCategories.has(n.category);
  }
  function linkVisible(e) { return isVisible(e.source) && isVisible(e.target); }

  // 指针下的节点：屏幕距离在半径内的，离观察者最近的那个优先
  function nodeAt(clientX, clientY) {
    let best = null, bestD = Infinity;
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      if (!isVisible(n)) continue;
      const r = Math.max(9, nodeRadius(n) * n.s * cam.k + 4);
      const dx = n.sx - clientX, dy = n.sy - clientY;
      if (dx * dx + dy * dy > r * r) continue;
      if (n.d < bestD) { bestD = n.d; best = n; }
    }
    return best;
  }

  let focus = null;         // Set(id) 或 null
  function recomputeFocus() {
    const anchor = state.selectedId || state.hoveredId;
    if (anchor) {
      focus = new Set([anchor]);
      neighbors.get(anchor).forEach(id => focus.add(id));
      return;
    }
    if (state.searchQuery) {
      focus = new Set();
      const q = state.searchQuery;
      nodes.forEach(n => { if (n._hay.includes(q)) focus.add(n.id); });
      return;
    }
    focus = null;
  }

  /* ---------- 绘制 ---------- */
  let dirty = true;
  let running = false;

  function roundRect(c, x, y, w, h, r) {
    if (c.roundRect) { c.roundRect(x, y, w, h, r); return; }
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  /* ---------- 动画状态 ----------
     intro：开场节点从中心向外依次“长”出来，连线随后淡入，相机同时转过来一点
     n._a：每个节点当前的不透明度，聚焦/取消聚焦时平滑过渡而不是一下子跳变
     dimMix：连线整体变暗的程度，同样做插值 */
  let introStart = -1e9;
  let introMaxDist = 1;
  const INTRO_SPREAD = 650, INTRO_GROW = 520, INTRO_TOTAL = INTRO_SPREAD + INTRO_GROW + 250;
  let dimMix = 0;
  nodes.forEach(n => { n._a = 1; });

  const easeOutBack = t => { const c = 1.6; t -= 1; return 1 + (c + 1) * t * t * t + c * t * t; };
  const clamp01 = t => t < 0 ? 0 : (t > 1 ? 1 : t);

  function beginIntro() {
    if (REDUCED_MOTION) { introStart = -1e9; return; }
    let cx = 0, cy = 0, cz = 0;
    nodes.forEach(n => { cx += n.x; cy += n.y; cz += n.z; });
    const len = nodes.length || 1;
    cx /= len; cy /= len; cz /= len;
    introMaxDist = 1;
    nodes.forEach(n => {
      n._dist = Math.hypot(n.x - cx, n.y - cy, n.z - cz);
      if (n._dist > introMaxDist) introMaxDist = n._dist;
    });
    introStart = performance.now();
  }
  function introScale(n, now) {
    const t = (now - introStart - (n._dist || 0) / introMaxDist * INTRO_SPREAD) / INTRO_GROW;
    return t >= 1 ? 1 : (t <= 0 ? 0 : Math.max(0, easeOutBack(t)));
  }
  function introing(now) { return now - introStart < INTRO_TOTAL; }

  // 每帧推进插值；返回 true 表示还没到位，需要继续重绘
  function stepAnimations() {
    let moving = false;
    const targetDim = focus ? 1 : 0;
    if (Math.abs(dimMix - targetDim) > 0.01) { dimMix += (targetDim - dimMix) * 0.2; moving = true; }
    else dimMix = targetDim;
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      const target = (focus && !focus.has(n.id)) ? 0.1 : 1;
      if (Math.abs(n._a - target) > 0.01) { n._a += (target - n._a) * 0.2; moving = true; }
      else n._a = target;
    }
    return moving;
  }

  // 光晕贴图：每种颜色预先画一张径向渐变，绘制时直接 drawImage，比 shadowBlur 便宜得多
  const glowCache = new Map();
  function glowSprite(col) {
    let c = glowCache.get(col);
    if (c) return c;
    c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, col);
    grad.addColorStop(0.35, col + '55');
    grad.addColorStop(1, col + '00');
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    glowCache.set(col, c);
    return c;
  }

  // 球体贴图：给笔记节点一点立体感（左上高光、右下暗部），按颜色缓存
  const ballCache = new Map();
  function ballSprite(col) {
    let c = ballCache.get(col);
    if (c) return c;
    c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = col;
    g.beginPath(); g.arc(32, 32, 31, 0, Math.PI * 2); g.fill();
    const hl = g.createRadialGradient(22, 20, 1, 30, 30, 34);
    hl.addColorStop(0, 'rgba(255,255,255,0.75)');
    hl.addColorStop(0.35, 'rgba(255,255,255,0.12)');
    hl.addColorStop(1, 'rgba(0,0,0,0.38)');
    g.fillStyle = hl;
    g.beginPath(); g.arc(32, 32, 31, 0, Math.PI * 2); g.fill();
    ballCache.set(col, c);
    return c;
  }

  // 背景星点：两层随机星点贴图平铺，随相机旋转做视差（远层慢、近层快）
  function makeStars(seed, count, size, bright) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < count; i++) {
      const r = rnd() < 0.85 ? 0.6 : 1.1;
      g.fillStyle = 'rgba(200, 220, 255, ' + (0.05 + rnd() * bright).toFixed(2) + ')';
      g.beginPath();
      g.arc(rnd() * size, rnd() * size, r, 0, Math.PI * 2);
      g.fill();
    }
    return ctx.createPattern(c, 'repeat');
  }
  const starLayers = [
    { pattern: makeStars(7, 70, 280, 0.2), speed: 0.35, turn: 140 },
    { pattern: makeStars(29, 26, 340, 0.32), speed: 0.6, turn: 260 }
  ];

  const LINK_STYLE = {
    hub:    { color: 'rgba(109, 230, 201, ', base: 0.22, dash: [4, 4], w: 1.1 },
    tag:    { color: 'rgba(233, 196, 106, ', base: 0.28, dash: [2, 5], w: 1.1 },
    direct: { color: 'rgba(150, 178, 220, ', base: 0.30, dash: null,   w: 1.35 }
  };
  // 深度分三层：近、中、远；远处的线更淡更细
  const BAND_ALPHA = [1.15, 0.75, 0.42], BAND_WIDTH = [1.25, 1, 0.75];
  const bandOf = d => d < -spread * 0.3 ? 0 : (d > spread * 0.3 ? 2 : 1);
  // 雾：越远越透明，平面模式下没有深度，全是 1
  const fog = d => isFlat() ? 1 : Math.min(1, Math.max(0.22, 1 - 0.78 * Math.max(0, d + spread * 0.25) / (spread * 1.25)));

  function draw() {
    const s = state.settings;
    const k = cam.k;
    const now = performance.now();
    const inIntro = introing(now);
    // 连线在节点长出一半后再淡入
    const edgeIntro = inIntro ? clamp01((now - introStart - INTRO_SPREAD * 0.5) / (INTRO_GROW + 200)) : 1;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);

    if (window.DOMMatrix) {
      for (const L of starLayers) {
        if (!L.pattern || !L.pattern.setTransform) continue;
        L.pattern.setTransform(new DOMMatrix().translate(-cam.yaw * L.turn + cam.ox * L.speed, cam.pitch * L.turn + cam.oy * L.speed));
        ctx.fillStyle = L.pattern;
        ctx.fillRect(0, 0, width, height);
      }
    }

    if (!isFlat()) drawFloor(k);

    const pad = 80;
    const inView = n => n.sx > -pad && n.sx < width + pad && n.sy > -pad && n.sy < height + pad && n.s > 0.12;

    /* --- 连线：按 kind × 深度层 + 是否高亮分桶，一桶一次 stroke --- */
    const lineScale = s.lineWidth / 100;
    const buckets = {};
    Object.keys(LINK_STYLE).forEach(kind => { buckets[kind] = [[], [], []]; });
    const strong = [];
    const anchor = state.selectedId || state.hoveredId;

    for (let i = 0; i < edges.length; i++) {
      const e = edges[i];
      if (!linkVisible(e)) continue;
      const a = e.source, b = e.target;
      if ((a.sx < 0 && b.sx < 0) || (a.sx > width && b.sx > width) ||
          (a.sy < 0 && b.sy < 0) || (a.sy > height && b.sy > height)) continue;
      if (anchor && (a.id === anchor || b.id === anchor)) { strong.push(e); continue; }
      (buckets[e.kind] || buckets.direct)[isFlat() ? 1 : bandOf((a.d + b.d) / 2)].push(e);
    }

    Object.keys(buckets).forEach(kind => {
      const st = LINK_STYLE[kind] || LINK_STYLE.direct;
      buckets[kind].forEach((list, band) => {
        if (!list.length) return;
        const alpha = Math.min(0.6, st.base * BAND_ALPHA[band]) * (1 - 0.8 * dimMix) * edgeIntro;
        if (alpha <= 0.002) return;
        ctx.strokeStyle = st.color + alpha.toFixed(3) + ')';
        ctx.lineWidth = st.w * lineScale * BAND_WIDTH[band] * Math.min(1.6, Math.max(0.6, Math.sqrt(k)));
        ctx.setLineDash(st.dash || []);
        ctx.beginPath();
        for (let i = 0; i < list.length; i++) {
          ctx.moveTo(list[i].source.sx, list[i].source.sy);
          ctx.lineTo(list[i].target.sx, list[i].target.sy);
        }
        ctx.stroke();
      });
    });

    if (strong.length) {
      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(127, 191, 255, ' + (0.9 * Math.max(edgeIntro, dimMix)).toFixed(3) + ')';
      ctx.lineWidth = 2 * lineScale;
      ctx.beginPath();
      for (let i = 0; i < strong.length; i++) {
        ctx.moveTo(strong[i].source.sx, strong[i].source.sy);
        ctx.lineTo(strong[i].target.sx, strong[i].target.sy);
      }
      ctx.stroke();
      if (s.arrows) drawArrows(strong);
    }
    ctx.setLineDash([]);

    /* --- 节点按深度从远到近排好，近的盖住远的 --- */
    const order = [];
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      if (isVisible(n) && inView(n)) order.push(n);
    }
    order.sort((a, b) => b.d - a.d);

    /* --- 光晕：大类节点和焦点节点下面垫一层柔光 --- */
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < order.length; i++) {
      const n = order[i];
      const isHub = n.type === 'hub';
      const lit = n.id === state.selectedId || n.id === state.hoveredId;
      if (!isHub && !lit) continue;
      const sc = inIntro ? introScale(n, now) : 1;
      const a = n._a * (lit ? 0.55 : 0.28) * sc * (lit ? 1 : fog(n.d));
      if (a < 0.02) continue;
      const g = nodeRadius(n) * n.s * k * (lit ? 4.2 : 3.4) * sc;
      ctx.globalAlpha = a;
      ctx.drawImage(glowSprite(colorOf(n)), n.sx - g, n.sy - g, g * 2, g * 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    /* --- 节点 --- */
    for (let i = 0; i < order.length; i++) {
      const n = order[i];
      const sc = inIntro ? introScale(n, now) : 1;
      if (sc <= 0.01) continue;
      const r = nodeRadius(n) * n.s * k * sc;
      if (r < 0.3) continue;
      const lit = focus && focus.has(n.id);
      ctx.globalAlpha = n._a * (lit ? 1 : fog(n.d));
      const col = colorOf(n);
      if (n.type === 'hub') {
        ctx.fillStyle = col;
        ctx.beginPath();
        roundRect(ctx, n.sx - r * 1.1, n.sy - r * 0.72, r * 2.2, r * 1.44, Math.min(12 * n.s * k, r * 0.7));
        ctx.fill();
        if (n._a > 0.5) { ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.1; ctx.stroke(); }
      } else if (r < 2.2) {
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.drawImage(ballSprite(col), n.sx - r, n.sy - r, r * 2, r * 2);
      }
    }
    ctx.globalAlpha = 1;

    /* --- 搜索命中：外面套一圈青色细环 --- */
    if (state.searchQuery && focus && !state.selectedId && !state.hoveredId) {
      ctx.strokeStyle = 'rgba(127, 233, 200, 0.7)';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      focus.forEach(id => {
        const n = byId.get(id);
        if (!n || !isVisible(n) || !inView(n)) return;
        const r = nodeRadius(n) * n.s * k + 5;
        ctx.moveTo(n.sx + r, n.sy);
        ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2);
      });
      ctx.stroke();
    }

    /* --- 选中 / 悬停的高亮圈；选中节点再加一圈向外扩散的波纹 --- */
    [state.selectedId, state.hoveredId].forEach((id, idx) => {
      if (!id) return;
      if (idx === 1 && id === state.selectedId) return;
      const n = byId.get(id);
      if (!n || !isVisible(n)) return;
      const r = nodeRadius(n) * n.s * k;
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, r + 6, 0, Math.PI * 2);
      ctx.strokeStyle = idx === 0 ? 'rgba(127,191,255,0.95)' : 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1.8;
      ctx.stroke();
      if (idx === 0 && !REDUCED_MOTION) {
        const t = (now % 1600) / 1600;
        ctx.beginPath();
        ctx.arc(n.sx, n.sy, r + 6 + t * 20, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(127,191,255,' + (0.6 * (1 - t)).toFixed(3) + ')';
        ctx.lineWidth = 1.4;
        ctx.stroke();
      }
    });

    /* --- 标签：在屏幕坐标里画，配合贪心避让，密集区域不会糊成一团 --- */
    drawLabels(k, inIntro ? now : 0);
    frames++;
  }

  // 标签按优先级排（大类 > 高连接度），保证挤不下时先保住重要的
  const labelOrder = nodes.slice().sort((a, b) =>
    (a.type === 'hub' ? 0 : 1) - (b.type === 'hub' ? 0 : 1) || (b.degree || 0) - (a.degree || 0));
  const textWidthCache = new Map();

  function measure(text, font) {
    const key = font + '\u0000' + text;
    let w = textWidthCache.get(key);
    if (w === undefined) {
      ctx.font = font;
      w = ctx.measureText(text).width;
      textWidthCache.set(key, w);
    }
    return w;
  }

  const NOTE_FONT = '11px Inter, -apple-system, "PingFang SC", sans-serif';
  const HUB_FONT = '600 12.5px Inter, -apple-system, "PingFang SC", sans-serif';

  // introNow 非 0 时处于开场动画：每个标签跟着自己的节点一起淡入
  function drawLabels(k, introNow) {
    const s = state.settings;
    if (s.textOpacity <= 0) return;

    const near = state.selectedId
      ? new Set([state.selectedId, ...neighbors.get(state.selectedId)])
      : null;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 3;
    const baseAlpha = s.textOpacity / 100;

    const placed = [];
    let drawn = 0;

    for (let i = 0; i < labelOrder.length && drawn < LABEL_BUDGET; i++) {
      const n = labelOrder[i];
      if (!isVisible(n)) continue;
      if (n.sx < -40 || n.sx > width + 40 || n.sy < -40 || n.sy > height + 40) continue;
      if (focus && !focus.has(n.id)) continue;

      const isHub = n.type === 'hub';
      const f = fog(n.d);
      const lit = (near && near.has(n.id)) || (focus && focus.has(n.id) && (state.hoveredId || state.searchQuery));
      if (!isHub && !lit) {
        if (!(k * n.s >= LABEL_MIN_SCALE || state.showLabels)) continue;
        if (!state.showLabels && (n.degree || 0) < 6) continue;
        if (!state.showLabels && f < 0.5) continue;   // 太远的普通笔记就不写名字了
      }

      const label = truncate(n.title, isHub ? 16 : 20);
      const font = isHub ? HUB_FONT : NOTE_FONT;
      const tw = measure(label, font);
      const th = isHub ? 15 : 13;
      const r = nodeRadius(n) * n.s * k;
      const sx = n.sx, sy = n.sy;

      // 大类标题居中放在节点下方，普通笔记贴在右侧
      const bx = isHub ? sx - tw / 2 : sx + r + 6;
      const by = (isHub ? sy + r * 0.72 + th * 0.9 : sy) - th / 2;

      if (bx + tw < 0 || bx > width || by + th < 0 || by > height) continue;

      let clash = false;
      for (let j = 0; j < placed.length; j++) {
        const q = placed[j];
        if (bx < q[2] && bx + tw > q[0] && by < q[3] && by + th > q[1]) { clash = true; break; }
      }
      if (clash) continue;
      placed.push([bx - 2, by - 1, bx + tw + 2, by + th + 1]);

      let a = baseAlpha * (lit ? 1 : Math.max(0.35, f));
      if (introNow) {
        const g = clamp01(introScale(n, introNow - 200));
        if (g <= 0.02) continue;
        a *= g;
      }
      ctx.globalAlpha = a;
      ctx.font = font;
      ctx.strokeStyle = 'rgba(3, 8, 16, 0.9)';
      ctx.strokeText(label, bx, by + th / 2);
      ctx.fillStyle = isHub ? '#ffffff' : 'rgba(233, 241, 255, 0.93)';
      ctx.fillText(label, bx, by + th / 2);
      drawn++;
    }
    ctx.globalAlpha = 1;
  }

  /* 地面：在图谱下方的水平面上画几圈同心椭圆，转动时一眼能看出这是个立体空间 */
  function drawFloor(k) {
    let cx = 0, cz = 0, maxY = -Infinity, cnt = 0;
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      if (!isVisible(n)) continue;
      cx += n.x; cz += n.z; cnt++;
      if (n.y > maxY) maxY = n.y;
    }
    if (!cnt) return;
    cx /= cnt; cz /= cnt;
    let R = 0;
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      if (!isVisible(n)) continue;
      const r = Math.hypot(n.x - cx, n.z - cz);
      if (r > R) R = r;
    }
    const y = maxY + 40;
    const cyw = Math.cos(cam.yaw), syw = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const F = focal(), ox = width / 2 + cam.ox, oy = height / 2 + cam.oy;
    const pt = (x, z) => {
      x -= cam.tx; const yy = y - cam.ty; z -= cam.tz;
      const x1 = x * cyw + z * syw, z1 = -x * syw + z * cyw;
      const y2 = yy * cp - z1 * sp, d = yy * sp + z1 * cp;
      const s = F / Math.max(F + d, F * 0.1);
      return [ox + x1 * s * k, oy + y2 * s * k];
    };
    const fade = clamp01((now() - introStart - INTRO_SPREAD) / 900);
    if (fade <= 0) return;
    ctx.lineWidth = 1;
    [0.45, 0.75, 1.05].forEach((f, i) => {
      ctx.strokeStyle = 'rgba(127, 191, 255, ' + ((0.09 - i * 0.02) * fade).toFixed(3) + ')';
      ctx.beginPath();
      for (let j = 0; j <= 72; j++) {
        const a = j / 72 * Math.PI * 2;
        const q = pt(cx + Math.cos(a) * R * f, cz + Math.sin(a) * R * f);
        if (j) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]);
      }
      ctx.stroke();
    });
    // 十字准线，标出转动的方向
    ctx.strokeStyle = 'rgba(127, 191, 255, ' + (0.05 * fade).toFixed(3) + ')';
    ctx.beginPath();
    [[1, 0], [0, 1]].forEach(([u, v]) => {
      const a = pt(cx - u * R * 1.05, cz - v * R * 1.05), b = pt(cx + u * R * 1.05, cz + v * R * 1.05);
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
    });
    ctx.stroke();
  }
  const now = () => performance.now();

  function drawArrows(list) {
    ctx.fillStyle = 'rgba(127, 191, 255, 0.85)';
    const size = 7;
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      const dx = e.target.sx - e.source.sx, dy = e.target.sy - e.source.sy;
      const len = Math.hypot(dx, dy) || 1;
      const r = nodeRadius(e.target) * e.target.s * cam.k + 2;
      const px = e.target.sx - (dx / len) * r, py = e.target.sy - (dy / len) * r;
      const a = Math.atan2(dy, dx);
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px - Math.cos(a - 0.4) * size, py - Math.sin(a - 0.4) * size);
      ctx.lineTo(px - Math.cos(a + 0.4) * size, py - Math.sin(a + 0.4) * size);
      ctx.closePath();
      ctx.fill();
    }
  }

  /* ---------- 主循环：没事就空转，不重绘 ---------- */
  let frames = 0, fpsT0 = performance.now(), lastFrame = performance.now();
  let touchedAt = 0;          // 用户最近一次动手的时间，自动旋转要等一会儿再开始
  function spinning(now) {
    return state.settings.autoRotate && !isFlat() && !REDUCED_MOTION && !document.hidden &&
      !pointer.down && !state.hoveredId && !state.selectedId && !camTween &&
      now - touchedAt > 3500 && !introing(now);
  }
  function loop() {
    const now = performance.now();
    const dt = Math.min(64, now - lastFrame);
    lastFrame = now;
    if (running) {
      tick();
      dirty = true;
      if (alpha < ALPHA_MIN && alphaTarget === 0) running = false;
    }
    if (stepCam(now)) dirty = true;
    // 平面模式下慢慢把相机转回正面（交给补间时不管）
    if (isFlat() && !camTween && (cam.yaw !== 0 || cam.pitch !== 0)) {
      cam.yaw = wrapAngle(cam.yaw) * 0.8; cam.pitch *= 0.8;
      if (Math.abs(cam.yaw) < 0.001) cam.yaw = 0;
      if (Math.abs(cam.pitch) < 0.001) cam.pitch = 0;
      dirty = true;
    }
    if (spinning(now)) { cam.yaw += SPIN_SPEED * dt; dirty = true; }
    if (stepAnimations()) dirty = true;
    if (introing(now)) dirty = true;
    if (state.selectedId && !REDUCED_MOTION) dirty = true;   // 选中波纹要持续动
    if (dirty) { project(); draw(); dirty = false; updateZoomLabel(); }

    if (state.settings.showFps) {
      if (now - fpsT0 >= 500) {
        $('fps').textContent = Math.round(frames / ((now - fpsT0) / 1000)) + ' fps';
        frames = 0; fpsT0 = now;
      }
    }
    requestAnimationFrame(loop);
  }

  function reheat(a) {
    alpha = Math.max(alpha, a);
    running = true;
  }

  /* ---------- 交互 ----------
     不再用 d3.zoom / d3.drag，全部用 pointer 事件自己处理：
     - 按下后几乎没动就松开 = 单击（选中节点 / 点空白取消），所以开场动画刚结束时的第一下点击也能选中
     - 按在节点上拖 = 挪节点；按在空白处拖 = 旋转（平面模式下是平移）
     - Shift / 右键 / 中键拖 = 平移；滚轮 = 缩放；双指 = 缩放 + 平移 */
  const tooltip = $('tooltip');
  let tipRaf = 0, tipPending = null;
  const pointer = { down: false, id: null, x0: 0, y0: 0, x: 0, y: 0, node: null, mode: null, moved: false };
  const touches = new Map();
  let pinch = null;
  let lastClick = { id: null, t: 0 };

  function hideTip() { tipPending = null; tooltip.style.display = 'none'; tooltip.classList.remove('show'); }

  function setHover(n) {
    const id = n ? n.id : null;
    canvas.classList.toggle('pointing', !!n);
    if (id !== state.hoveredId) {
      state.hoveredId = id;
      recomputeFocus();
      dirty = true;
    }
  }

  function showTip(n, x, y) {
    if (!n) { hideTip(); return; }
    // 记下最新的悬停目标，等 rAF 真的跑到时再读，避免鼠标已经移开却弹出旧内容
    tipPending = { node: n, x, y };
    if (tipRaf) return;
    tipRaf = requestAnimationFrame(() => {
      tipRaf = 0;
      const t = tipPending;
      if (!t || !state.hoveredId || state.hoveredId !== t.node.id) { hideTip(); return; }
      const fresh = tooltip.dataset.id !== t.node.id || tooltip.style.display !== 'block';
      tooltip.style.display = 'block';
      if (fresh) {
        tooltip.dataset.id = t.node.id;
        tooltip.classList.remove('show');
        void tooltip.offsetWidth;   // 重新触发淡入动画
        tooltip.classList.add('show');
      }
      tooltip.style.left = Math.min(t.x + 14, window.innerWidth - 316) + 'px';
      tooltip.style.top = Math.min(t.y + 14, window.innerHeight - 110) + 'px';
      tooltip.innerHTML =
        '<strong><span class="tip-dot" style="background:' + colorOf(t.node) + ';color:' + colorOf(t.node) + '"></span>' +
        escapeHtml(t.node.title) + '</strong>' +
        '<div class="mini">' + escapeHtml(typeLabel(t.node.type, t.node.synthetic)) + ' · ' +
        escapeHtml(t.node.category) + ' · ' + t.node.degree + ' 条连接</div>' +
        '<div class="mini">' + escapeHtml(truncate(t.node.excerpt || t.node.path, 80)) + '</div>';
    });
  }

  function selectNode(n) {
    state.selectedId = n ? n.id : null;
    updateDetails(n);
    if (n) switchTab('detail');
    recomputeFocus();
    dirty = true;
  }

  function openNode(n) { if (n && n.url) window.location.href = n.url; }

  canvas.addEventListener('contextmenu', e => e.preventDefault());

  canvas.addEventListener('pointerdown', event => {
    touches.set(event.pointerId, [event.clientX, event.clientY]);
    try { canvas.setPointerCapture(event.pointerId); } catch (e) {}
    camTween = null;
    touchedAt = performance.now();
    if (touches.size === 2) {
      // 第二根手指落下：取消单指的拖动，改成双指缩放
      const [a, b] = [...touches.values()];
      pinch = { dist: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, mx: (a[0] + b[0]) / 2, my: (a[1] + b[1]) / 2 };
      if (pointer.node && pointer.mode === 'node') { pointer.node.fx = null; alphaTarget = 0; }
      pointer.mode = 'pinch'; pointer.moved = true;
      return;
    }
    if (touches.size > 2) return;
    const n = nodeAt(event.clientX, event.clientY);
    Object.assign(pointer, {
      down: true, id: event.pointerId, x0: event.clientX, y0: event.clientY, x: event.clientX, y: event.clientY,
      node: n, moved: false,
      mode: n && event.button === 0 && !event.shiftKey ? 'node'
        : (event.shiftKey || event.button === 1 || event.button === 2 || isFlat()) ? 'pan' : 'orbit'
    });
    if (event.pointerType !== 'mouse') { setHover(n); }
    hideTip();
  });

  canvas.addEventListener('pointermove', event => {
    if (touches.has(event.pointerId)) touches.set(event.pointerId, [event.clientX, event.clientY]);
    if (pinch && touches.size >= 2) {
      const [a, b] = [...touches.values()];
      const dist = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      panBy(mx - pinch.mx, my - pinch.my);
      zoomAt(mx, my, cam.k * dist / pinch.dist);
      pinch = { dist, mx, my };
      touchedAt = performance.now();
      dirty = true;
      return;
    }
    if (!pointer.down) {
      if (event.pointerType !== 'mouse') return;
      const n = nodeAt(event.clientX, event.clientY);
      setHover(n);
      showTip(n, event.clientX, event.clientY);
      return;
    }
    if (event.pointerId !== pointer.id) return;
    const dx = event.clientX - pointer.x, dy = event.clientY - pointer.y;
    if (!pointer.moved && Math.hypot(event.clientX - pointer.x0, event.clientY - pointer.y0) < 5) return;
    if (!pointer.moved) {
      pointer.moved = true;
      canvas.classList.add('grabbing');
      if (pointer.mode === 'node') { reheat(0.2); alphaTarget = 0.2; }
    }
    pointer.x = event.clientX; pointer.y = event.clientY;
    touchedAt = performance.now();
    if (pointer.mode === 'node') {
      const n = pointer.node;
      const p = unproject(event.clientX, event.clientY, n.d);
      if (isFlat()) p[2] = 0;
      n.fx = p;
      n.x = p[0]; n.y = p[1]; n.z = p[2];
      setHover(n);
    } else if (pointer.mode === 'pan') {
      panBy(dx, dy);
    } else if (pointer.mode === 'orbit') {
      // 像转地球仪：靠近你的那一面跟着指针走
      cam.yaw += dx * 0.008;
      cam.pitch = Math.max(-1.45, Math.min(1.45, cam.pitch + dy * 0.008));
    }
    dirty = true;
  });

  function endPointer(event, cancelled) {
    touches.delete(event.pointerId);
    if (touches.size < 2) pinch = null;
    if (!pointer.down || event.pointerId !== pointer.id) {
      if (!touches.size) pointer.down = false;
      return;
    }
    const p = Object.assign({}, pointer);
    pointer.down = false; pointer.node = null; pointer.mode = null;
    canvas.classList.remove('grabbing');
    touchedAt = performance.now();
    if (p.mode === 'node' && p.node) {
      p.node.fx = null;
      alphaTarget = 0;
    }
    if (cancelled || p.moved) return;
    // 没怎么动：当作一次单击
    const n = nodeAt(event.clientX, event.clientY) || null;
    const now = performance.now();
    if (n && lastClick.id === n.id && now - lastClick.t < 380) { openNode(n); lastClick = { id: null, t: 0 }; return; }
    lastClick = { id: n ? n.id : null, t: now };
    if (event.button !== 0 && event.pointerType === 'mouse') return;
    selectNode(n);
    if (event.pointerType !== 'mouse') setHover(null);
  }
  canvas.addEventListener('pointerup', e => endPointer(e, false));
  canvas.addEventListener('pointercancel', e => endPointer(e, true));

  canvas.addEventListener('pointerleave', event => {
    if (event.pointerType !== 'mouse' || pointer.down) return;
    setHover(null);
    hideTip();
  });

  canvas.addEventListener('wheel', event => {
    event.preventDefault();
    camTween = null;
    touchedAt = performance.now();
    const unit = event.deltaMode === 1 ? 16 : (event.deltaMode === 2 ? 400 : 1);
    const f = Math.pow(2, -event.deltaY * unit * (event.ctrlKey ? 0.01 : 0.002));
    zoomAt(event.clientX, event.clientY, cam.k * f);
  }, { passive: false });

  // 把相机转动中心移到节点上，并放大一点
  function centerOn(n, scale) {
    const k = scale || Math.max(cam.k, 1.1);
    const ins = panelInsets();
    const ox = ins.l + Math.max(160, width - ins.l - ins.r) / 2 - width / 2;
    const oy = ins.t + Math.max(160, height - ins.t - ins.b) / 2 - height / 2;
    touchedAt = performance.now();
    animateCam({ tx: n.x, ty: n.y, tz: n.z, k, ox, oy }, 620);
  }

  // 两侧面板会盖住画布，适配视图时把可用区域算进去，图不会被压在面板底下
  function panelInsets() {
    const L = $('panel-left'), R = $('panel-right');
    const lr = (L && !L.hidden) ? L.getBoundingClientRect() : null;
    const rr = (R && !R.hidden) ? R.getBoundingClientRect() : null;
    // 窄屏时面板是上下堆叠的，要让出上下空间；宽屏时是左右分栏，让出左右
    if (width < 900) {
      return {
        l: 12,
        r: 12,
        t: (lr ? lr.bottom : 0) + 12,
        b: (rr ? height - rr.top : 0) + 12
      };
    }
    return {
      l: (lr ? lr.right : 0) + 18,
      r: (rr ? width - rr.left : 0) + 18,
      t: 18,
      b: 58
    };
  }

  /* 适配视图：转动中心放到可见节点的中心；3D 时按“绕 y 轴转一整圈都不出框”来算缩放，
     自动旋转时图不会转着转着跑出屏幕 */
  function computeFit(maxScale, angles) {
    const vis = nodes.filter(isVisible);
    if (!vis.length) return null;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, minZ = Infinity, maxZ = -Infinity;
    for (let i = 0; i < vis.length; i++) {
      const n = vis[i];
      if (n.x < minX) minX = n.x; if (n.x > maxX) maxX = n.x;
      if (n.y < minY) minY = n.y; if (n.y > maxY) maxY = n.y;
      if (n.z < minZ) minZ = n.z; if (n.z > maxZ) maxZ = n.z;
    }
    const tx = (minX + maxX) / 2, ty = (minY + maxY) / 2, tz = isFlat() ? 0 : (minZ + maxZ) / 2;
    let w, h;
    if (isFlat()) {
      w = maxX - minX; h = maxY - minY;
    } else {
      const pitch = angles ? angles.pitch : cam.pitch;
      const cp = Math.abs(Math.cos(pitch)), sp = Math.abs(Math.sin(pitch));
      let rxz = 0, hy = 0;
      for (let i = 0; i < vis.length; i++) {
        const n = vis[i];
        const r = Math.hypot(n.x - tx, n.z - tz);
        if (r > rxz) rxz = r;
        const yy = Math.abs(n.y - ty) * cp + r * sp;
        if (yy > hy) hy = yy;
      }
      // 透视会让离得近的那半边显得更大，留一点余量
      const persp = 1.06;
      w = 2 * rxz * persp; h = 2 * hy * persp;
    }
    w = Math.max(240, w); h = Math.max(240, h);
    const ins = panelInsets();
    const availW = Math.max(160, width - ins.l - ins.r);
    const availH = Math.max(160, height - ins.t - ins.b);
    const k = Math.min(maxScale, 0.97 / Math.max(w / availW, h / availH));
    if (!Number.isFinite(k) || k <= 0.01) return null;
    return { tx, ty, tz, k, ox: ins.l + availW / 2 - width / 2, oy: ins.t + availH / 2 - height / 2 };
  }

  function fitView(immediate, angles) {
    const goal = computeFit(1.6, angles);
    if (!goal) return;
    if (angles) Object.assign(goal, angles);
    // 从异常尺寸恢复时不要用动画：后台标签页里 rAF 被节流，过渡不会跑完
    animateCam(goal, immediate === true ? 0 : 560);
  }

  /* ---------- 缩放控件 ---------- */
  let lastZoomText = '';
  function updateZoomLabel() {
    const txt = Math.round(cam.k * 100) + '%';
    if (txt !== lastZoomText) { lastZoomText = txt; $('zoom-val').textContent = txt; }
  }
  function zoomBy(f) {
    touchedAt = performance.now();
    const ux = -cam.ox, uy = -cam.oy;   // 以画布中心为缩放点
    const k = Math.max(0.05, Math.min(6, cam.k * f));
    const s = 1 - cam.k / k;
    const [x, y, z] = unrotate(ux / cam.k * s, uy / cam.k * s);
    animateCam({ tx: cam.tx + x, ty: cam.ty + y, tz: cam.tz + z, k }, 260);
  }
  $('zoom-in').addEventListener('click', () => zoomBy(1.35));
  $('zoom-out').addEventListener('click', () => zoomBy(1 / 1.35));
  $('zoom-fit').addEventListener('click', () => fitView());

  /* ---------- 面板 ---------- */
  function refreshStats() {
    const vis = nodes.filter(isVisible);
    const items = [
      ['节点', vis.length],
      ['连接', edges.filter(linkVisible).length],
      ['正文', vis.filter(n => n.published).length],
      ['大类', vis.filter(n => n.type === 'hub').length]
    ];
    $('quick-stats').innerHTML = items
      .map(it => '<div class="stat"><span class="value" data-v="' + it[1] + '">' + it[1] + '</span><span class="label">' + it[0] + '</span></div>')
      .join('');
  }

  // 开场时数字从 0 滚到真实值
  function countUpStats() {
    if (REDUCED_MOTION) return;
    const els = [...document.querySelectorAll('#quick-stats .value')];
    const t0 = performance.now(), dur = 900;
    const step = () => {
      const t = clamp01((performance.now() - t0) / dur);
      const e = 1 - Math.pow(1 - t, 3);
      els.forEach(el => { el.textContent = Math.round(Number(el.dataset.v) * e); });
      if (t < 1) requestAnimationFrame(step);
    };
    step();
  }

  function renderLegend() {
    const box = $('legend-items');
    box.innerHTML = '';
    const counts = new Map();
    nodes.forEach(n => counts.set(n.category, (counts.get(n.category) || 0) + 1));
    graph.categories.forEach(cat => {
      const el = document.createElement('div');
      el.className = 'legend-item' + (state.hiddenCategories.has(cat) ? ' off' : '');
      el.innerHTML =
        '<span class="swatch" style="background:' + (categoryColor[cat] || '#9fb0ca') + '"></span>' +
        '<span class="name">' + escapeHtml(cat) + '</span>' +
        '<span class="num">' + (counts.get(cat) || 0) + '</span>';
      el.addEventListener('click', () => {
        if (state.hiddenCategories.has(cat)) state.hiddenCategories.delete(cat);
        else state.hiddenCategories.add(cat);
        renderLegend();
        refreshStats();
        recomputeFocus();
        dirty = true;
      });
      box.appendChild(el);
    });
  }

  function updateDetails(n) {
    const body = $('tab-detail');
    if (!n) {
      body.innerHTML = '<div class="empty-hint">点一个节点看它的标签、摘要和相邻节点<br>双击节点直接打开文章</div>';
      return;
    }
    const near = [...neighbors.get(n.id)]
      .map(id => byId.get(id))
      .filter(Boolean)
      .sort((a, b) => (b.degree || 0) - (a.degree || 0) || a.title.localeCompare(b.title, 'zh-CN'));

    const chips = [
      '<span class="chip">' + typeLabel(n.type, n.synthetic) + '</span>',
      '<span class="chip dot" style="--dot:' + colorOf(n) + '">' + escapeHtml(n.category) + '</span>',
      '<span class="chip">' + n.degree + ' 条连接</span>'
    ].concat((n.tags || []).slice(0, 8).map(t => '<span class="chip">#' + escapeHtml(t) + '</span>'));

    body.innerHTML =
      '<h3 class="node-title">' + escapeHtml(n.title) + '</h3>' +
      '<div class="meta-row">' + chips.join('') + '</div>' +
      '<div class="excerpt">' + escapeHtml(n.excerpt || '这条笔记没有可提取的正文摘要。') + '</div>' +
      '<div class="detail-actions">' +
        (n.url ? '<button class="btn primary" id="open-node-btn">打开文章</button>' : '') +
        '<button class="btn" id="focus-node-btn">聚焦周边</button>' +
      '</div>' +
      (n.url ? '' : '<div class="detail-line"><span>说明</span><span>分类用的大类节点，没有单独页面</span></div>') +
      '<div class="detail-line"><span>路径</span><span>' + escapeHtml(n.path) + '</span></div>' +
      '<div class="detail-line"><span>一级目录</span><span>' + escapeHtml(n.folder || '根目录') + '</span></div>' +
      '<div class="section-title"><span>相邻节点</span><span>' + near.length + '</span></div>' +
      '<div class="neighbors" id="neighbors-box"></div>';

    const box = $('neighbors-box');
    near.slice(0, 24).forEach(item => {
      const el = document.createElement('button');
      el.className = 'neighbor';
      el.innerHTML = '<span class="swatch" style="background:' + colorOf(item) + '"></span>' +
                     '<span class="txt">' + escapeHtml(item.title) + '</span>';
      el.addEventListener('click', () => {
        state.selectedId = item.id;
        updateDetails(item);
        centerOn(item);
        recomputeFocus();
        dirty = true;
      });
      box.appendChild(el);
    });

    const fb = $('focus-node-btn');
    if (fb) fb.addEventListener('click', () => centerOn(n, 1.5));
    const ob = $('open-node-btn');
    if (ob) ob.addEventListener('click', () => { window.location.href = n.url; });
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    ['detail', 'filter', 'setting'].forEach(k => { $('tab-' + k).hidden = (k !== name); });
  }
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchTab(t.dataset.tab));
  });

  /* ---------- 设置 ---------- */
  function saveSettings() {
    try { window.localStorage.setItem('joey-graph-settings', JSON.stringify(state.settings)); } catch (e) {}
  }

  function updateSettingLabels() {
    const s = state.settings;
    const map = {
      'setting-text-opacity-value': s.textOpacity + '%',
      'setting-node-scale-value': s.nodeScale + '%',
      'setting-line-width-value': s.lineWidth + '%',
      'setting-center-strength-value': (s.centerStrength / 200).toFixed(2),
      'setting-charge-strength-value': s.chargeStrength,
      'setting-link-strength-value': (s.linkStrength / 100).toFixed(2),
      'setting-link-distance-value': s.linkDistance + '%'
    };
    Object.keys(map).forEach(id => { const el = $(id); if (el) el.textContent = map[id]; });
  }

  const BINDINGS = [
    ['setting-arrows', 'arrows', 'checked', false],
    ['setting-fps', 'showFps', 'checked', false],
    ['setting-rotate', 'autoRotate', 'checked', false],
    ['setting-text-opacity', 'textOpacity', 'value', false],
    ['setting-node-scale', 'nodeScale', 'value', false],
    ['setting-line-width', 'lineWidth', 'value', false],
    ['setting-center-strength', 'centerStrength', 'value', true],
    ['setting-charge-strength', 'chargeStrength', 'value', true],
    ['setting-link-strength', 'linkStrength', 'value', true],
    ['setting-link-distance', 'linkDistance', 'value', true]
  ];

  function syncInputs() {
    BINDINGS.forEach(b => {
      const el = $(b[0]);
      if (!el) return;
      if (b[2] === 'checked') el.checked = !!state.settings[b[1]];
      else el.value = state.settings[b[1]];
    });
    $('dim-btn').classList.toggle('on', !isFlat());
  }

  BINDINGS.forEach(([id, key, prop, physical]) => {
    const el = $(id);
    if (!el) return;
    el.addEventListener(prop === 'checked' ? 'change' : 'input', () => {
      state.settings[key] = prop === 'checked' ? el.checked : Number(el.value);
      if (key === 'showFps') $('fps').hidden = !el.checked;
      if (key === 'autoRotate') touchedAt = 0;
      if (physical) reheat(0.35);
      updateSettingLabels();
      saveSettings();
      dirty = true;
    });
  });

  $('reset-settings').addEventListener('click', () => {
    const flat = state.settings.flat;
    state.settings = Object.assign({}, DEFAULTS, { flat });
    syncInputs();
    updateSettingLabels();
    saveSettings();
    $('fps').hidden = true;
    reheat(0.4);
  });

  /* 3D ⇄ 平面：压平时 z 收回 0、相机转正；展开时给每个节点一点随机的 z 速度让它重新鼓起来 */
  function setFlat(on) {
    if (isFlat() === on) return;
    state.settings.flat = on;
    saveSettings();
    $('dim-btn').classList.toggle('on', !on);
    if (!on) {
      nodes.forEach(n => { n.vz += (Math.random() - 0.5) * 50; });
      reheat(0.6);
      setTimeout(() => fitView(false, { yaw: HOME_VIEW.yaw, pitch: HOME_VIEW.pitch }), 700);
      animateCam({ yaw: HOME_VIEW.yaw, pitch: HOME_VIEW.pitch }, 700);
    } else {
      reheat(0.5);
      animateCam({ yaw: 0, pitch: 0 }, 600);
      setTimeout(() => fitView(false, { yaw: 0, pitch: 0 }), 650);
    }
    touchedAt = performance.now();
  }

  /* ---------- 工具栏 ---------- */
  $('fit-btn').addEventListener('click', () => fitView());
  $('dim-btn').addEventListener('click', () => setFlat(!isFlat()));
  $('reset-btn').addEventListener('click', () => {
    touchedAt = performance.now();
    fitView(false, isFlat() ? { yaw: 0, pitch: 0 } : { yaw: HOME_VIEW.yaw, pitch: HOME_VIEW.pitch });
  });
  $('helper-btn').addEventListener('click', e => {
    state.showHelpers = !state.showHelpers;
    e.currentTarget.classList.toggle('on', state.showHelpers);
    if (state.selectedId && !isVisible(byId.get(state.selectedId))) {
      state.selectedId = null;
      updateDetails(null);
    }
    refreshStats();
    recomputeFocus();
    dirty = true;
  });
  $('labels-btn').addEventListener('click', e => {
    state.showLabels = !state.showLabels;
    e.currentTarget.classList.toggle('on', state.showLabels);
    dirty = true;
  });
  $('animate-btn').addEventListener('click', () => reheat(0.9));
  $('legend-all').addEventListener('click', () => {
    state.hiddenCategories.clear();
    renderLegend();
    refreshStats();
    dirty = true;
  });
  $('collapse-left').addEventListener('click', e => {
    const p = $('panel-left');
    p.classList.toggle('collapsed');
    e.currentTarget.textContent = p.classList.contains('collapsed') ? '+' : '−';
    if (width < 900) fitView();
  });

  const search = $('search');
  search.addEventListener('input', function () {
    state.searchQuery = this.value.trim().toLowerCase();
    let hits = 0;
    if (state.searchQuery) nodes.forEach(n => { if (n._hay.includes(state.searchQuery)) hits++; });
    $('search-count').textContent = state.searchQuery ? hits + ' 个' : '';
    recomputeFocus();
    dirty = true;
  });
  search.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' || !state.searchQuery) return;
    const target = nodes.find(n => n._hay.includes(state.searchQuery) && isVisible(n));
    if (!target) return;
    selectNode(target);
    centerOn(target, 1.5);
  });

  document.addEventListener('keydown', event => {
    if (event.target.tagName === 'INPUT') {
      if (event.key === 'Escape') { search.value = ''; search.dispatchEvent(new Event('input')); search.blur(); }
      return;
    }
    if (event.key === '/') { event.preventDefault(); search.focus(); }
    if (event.key === 'f') fitView();
    if (event.key === 'Escape') selectNode(null);
  });

  let lastW = 0, lastH = 0, autoCollapsed = false;
  function handleViewportChange() {
    const prevW = lastW, prevH = lastH;
    resize();
    if (width === lastW && height === lastH) return;
    lastW = width; lastH = height;

    const wasDegenerate = prevW <= 1 || prevH <= 1;
    const modeChanged = (prevW < 900) !== (width < 900);
    // 变化幅度很大时（转屏、拖窗口、面板展开）原来的视图会偏到角落，需要重新对准
    const bigChange = prevW > 1 &&
      (Math.abs(width - prevW) / prevW > 0.35 || Math.abs(height - prevH) / prevH > 0.35);

    // 窄屏时我们替用户收起了左侧面板，回到宽屏就还原
    if (modeChanged) {
      const L = $('panel-left');
      if (width < 900 && !L.classList.contains('collapsed')) {
        L.classList.add('collapsed');
        $('collapse-left').textContent = '+';
        autoCollapsed = true;
      } else if (width >= 900 && autoCollapsed) {
        L.classList.remove('collapsed');
        $('collapse-left').textContent = '−';
        autoCollapsed = false;
      }
    }

    if (wasDegenerate) fitView(true);
    else if (modeChanged || bigChange) fitView();
    dirty = true;
  }

  /* ---------- 启动 ---------- */
  runWarmup(finishStart);

  function finishStart() {
    if (window.ResizeObserver) {
      new ResizeObserver(handleViewportChange).observe(document.documentElement);
    }
    window.addEventListener('resize', handleViewportChange);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) handleViewportChange();
    });

    setProgress(90, '点亮节点…');
    resize();
    lastW = width; lastH = height;
    syncInputs();
    updateSettingLabels();
    $('fps').hidden = !state.settings.showFps;
    renderLegend();
    refreshStats();
    updateDetails(null);
    $('brand-sub').textContent = graph.meta.nodeCount + ' 个节点 · ' + graph.meta.edgeCount + ' 条连接';

    const foot = document.querySelector('.footbar');
    const chrome = [[$('panel-left'), 0.15], [$('panel-right'), 0.25], [$('zoom-ctrl'), 0.4], [foot, 0.45]];
    chrome.forEach(([el]) => { el.hidden = false; });
    if (width < 900) {
      $('panel-left').classList.add('collapsed');
      $('collapse-left').textContent = '+';
      autoCollapsed = true;
    }
    setProgress(100, '完成');

    // 预热已经把布局跑好了，这里直接对准视图；3D 时相机从侧面一点的位置转过来
    const initial = computeFit(1.4);
    if (initial) Object.assign(cam, initial);
    if (!isFlat() && !REDUCED_MOTION) {
      const goalYaw = cam.yaw;
      cam.yaw = goalYaw - 0.9; cam.k *= 0.82;
      animateCam({ yaw: goalYaw, k: initial ? initial.k : 1 }, INTRO_TOTAL + 500);
    }

    // 先按面板的最终位置算好视图，再让面板、底栏依次滑入
    if (!REDUCED_MOTION) {
      chrome.forEach(([el, d]) => { el.style.setProperty('--delay', d + 's'); el.classList.add('enter'); });
    }

    // 进度条走满后再撤掉加载层，同时开始“生长”动画
    setTimeout(() => {
      beginIntro();
      project();
      draw();
      requestAnimationFrame(loop);
      const el = $('loading');
      el.classList.add('done');
      setTimeout(() => { el.style.display = 'none'; }, 650);
      setTimeout(countUpStats, 200);
    }, REDUCED_MOTION ? 0 : 260);
  }
}
</script>
</body>
</html>
