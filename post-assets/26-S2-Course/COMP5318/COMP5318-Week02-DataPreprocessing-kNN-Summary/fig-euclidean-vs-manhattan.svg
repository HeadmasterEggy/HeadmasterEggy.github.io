<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" role="img" aria-label="二维坐标系中欧氏距离与曼哈顿距离的对比" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>二维坐标系中欧氏距离与曼哈顿距离的对比</title>
<defs><marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect width="680" height="480" fill="#ffffff"/>
<line x1="130" y1="430" x2="130" y2="70" stroke="#e5e7eb" stroke-width="1"/>
<line x1="70" y1="370" x2="430" y2="370" stroke="#e5e7eb" stroke-width="1"/>
<text x="130" y="450" font-size="13" fill="#6b7280" text-anchor="middle">1</text>
<text x="60" y="374" font-size="13" fill="#6b7280" text-anchor="end">1</text>
<line x1="190" y1="430" x2="190" y2="70" stroke="#e5e7eb" stroke-width="1"/>
<line x1="70" y1="310" x2="430" y2="310" stroke="#e5e7eb" stroke-width="1"/>
<text x="190" y="450" font-size="13" fill="#6b7280" text-anchor="middle">2</text>
<text x="60" y="314" font-size="13" fill="#6b7280" text-anchor="end">2</text>
<line x1="250" y1="430" x2="250" y2="70" stroke="#e5e7eb" stroke-width="1"/>
<line x1="70" y1="250" x2="430" y2="250" stroke="#e5e7eb" stroke-width="1"/>
<text x="250" y="450" font-size="13" fill="#6b7280" text-anchor="middle">3</text>
<text x="60" y="254" font-size="13" fill="#6b7280" text-anchor="end">3</text>
<line x1="310" y1="430" x2="310" y2="70" stroke="#e5e7eb" stroke-width="1"/>
<line x1="70" y1="190" x2="430" y2="190" stroke="#e5e7eb" stroke-width="1"/>
<text x="310" y="450" font-size="13" fill="#6b7280" text-anchor="middle">4</text>
<text x="60" y="194" font-size="13" fill="#6b7280" text-anchor="end">4</text>
<line x1="370" y1="430" x2="370" y2="70" stroke="#e5e7eb" stroke-width="1"/>
<line x1="70" y1="130" x2="430" y2="130" stroke="#e5e7eb" stroke-width="1"/>
<text x="370" y="450" font-size="13" fill="#6b7280" text-anchor="middle">5</text>
<text x="60" y="134" font-size="13" fill="#6b7280" text-anchor="end">5</text>
<line x1="430" y1="430" x2="430" y2="70" stroke="#e5e7eb" stroke-width="1"/>
<line x1="70" y1="70" x2="430" y2="70" stroke="#e5e7eb" stroke-width="1"/>
<text x="430" y="450" font-size="13" fill="#6b7280" text-anchor="middle">6</text>
<text x="60" y="74" font-size="13" fill="#6b7280" text-anchor="end">6</text>
<text x="60" y="450" font-size="13" fill="#6b7280" text-anchor="end">0</text>
<line x1="70" y1="430" x2="466.0" y2="430" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ax)"/>
<line x1="70" y1="430" x2="70" y2="34.0" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ax)"/>
<text x="472.0" y="435" font-size="15" fill="#1f2937" font-style="italic">x₁</text>
<text x="64" y="26.0" font-size="15" fill="#1f2937" font-style="italic" text-anchor="middle">x₂</text>
<polyline points="130,370 310,370 310,130" fill="none" stroke="#ea580c" stroke-width="3.5" stroke-linejoin="round"/>
<rect x="298" y="358" width="12" height="12" fill="none" stroke="#ea580c" stroke-width="1.2"/>
<text x="220.0" y="392" font-size="14" fill="#ea580c" text-anchor="middle">|1−4| = 3</text>
<text x="320" y="255" font-size="14" fill="#ea580c">|1−5| = 4</text>
<line x1="130" y1="370" x2="310" y2="130" stroke="#059669" stroke-width="3.5"/>
<text x="206.0" y="244" font-size="14" fill="#059669" text-anchor="end">√(3²+4²) = 5</text>
<circle cx="130" cy="370" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
<circle cx="310" cy="130" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
<text x="120" y="358" font-size="15" fill="#2563eb" font-weight="600" text-anchor="end">A (1, 1)</text>
<text x="320" y="120" font-size="15" fill="#2563eb" font-weight="600">B (4, 5)</text>
<rect x="486" y="60" width="180" height="150" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
<line x1="500" y1="92" x2="530" y2="92" stroke="#059669" stroke-width="3.5"/>
<text x="540" y="88" font-size="14" fill="#1f2937">欧氏距离 L2</text>
<text x="540" y="106" font-size="13" fill="#059669">斜着直走 = 5</text>
<polyline points="500,140 520,140 520,126" fill="none" stroke="#ea580c" stroke-width="3.5"/>
<text x="540" y="136" font-size="14" fill="#1f2937">曼哈顿距离 L1</text>
<text x="540" y="154" font-size="13" fill="#ea580c">横 3 + 竖 4 = 7</text>
<text x="500" y="188" font-size="12" fill="#6b7280">两点之间直线最短：</text>
<text x="500" y="203" font-size="12" fill="#6b7280">L2 ≤ L1 恒成立</text>
</svg>
