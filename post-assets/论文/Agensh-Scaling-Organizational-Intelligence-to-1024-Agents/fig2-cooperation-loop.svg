<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" role="img" aria-label="Agensh 五步协作循环与组织基础设施">
<title>Agensh 五步协作循环与组织基础设施</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>
<rect width="940" height="500" fill="#ffffff"/>
<text x="470.0" y="30" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold" >Agensh 的五步协作循环（每个工作者异步、并发地重复执行）</text>
<rect x="30" y="100" width="152" height="104" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="106.0" y="126" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" >① 收集上下文</text>
<text x="106.0" y="144" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" >Gather context</text>
<text x="106.0" y="168" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" >读目标、同伴进度</text><text x="106.0" y="185" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" >消息、已有发现</text>
<line x1="185" y1="152.0" x2="213" y2="152.0" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="216" y="100" width="152" height="104" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="292.0" y="126" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" >② 认领子任务</text>
<text x="292.0" y="144" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" >Claim sub-task</text>
<text x="292.0" y="168" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" >写 CLAIM</text><text x="292.0" y="185" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" >重叠则私信协商</text>
<line x1="371" y1="152.0" x2="399" y2="152.0" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="402" y="100" width="152" height="104" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="478.0" y="126" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" >③ 执行</text>
<text x="478.0" y="144" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" >Take action</text>
<text x="478.0" y="168" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" >本地用工具实现</text><text x="478.0" y="185" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" >有发现就写共享上下文</text>
<line x1="557" y1="152.0" x2="585" y2="152.0" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="588" y="100" width="152" height="104" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="664.0" y="126" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" >④ 验证</text>
<text x="664.0" y="144" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" >Verify results</text>
<text x="664.0" y="168" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" >对照验收标准</text><text x="664.0" y="185" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" >不满足就修正</text>
<line x1="743" y1="152.0" x2="771" y2="152.0" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="774" y="100" width="152" height="104" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="850.0" y="126" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" >⑤ 合并进展</text>
<text x="850.0" y="144" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" >Merge progress</text>
<text x="850.0" y="168" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" >合入主分支</text><text x="850.0" y="185" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" >PATCH_SUMMARY + 证据</text>
<path d="M850.0,98 C850.0,64 106.0,64 106.0,96" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="470.0" y="58" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" >repeat：合并后立即回到 ①，不等其他人</text>
<rect x="30" y="320" width="880" height="150" rx="14" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
<text x="470.0" y="346" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" >组织基础设施（所有工作者共用）</text>
<rect x="65" y="362" width="250" height="90" rx="10" fill="#ffffff" stroke="#ca8a04" stroke-width="1.2"/>
<text x="190.0" y="388" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold" >共享工作区 · Gitea</text>
<text x="190.0" y="412" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" >仓库、分支、issue、PR</text><text x="190.0" y="430" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" >保留历史，暴露合并冲突</text>
<rect x="345" y="362" width="250" height="90" rx="10" fill="#ffffff" stroke="#ca8a04" stroke-width="1.2"/>
<text x="470.0" y="388" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold" >消息接口 · Mattermost</text>
<text x="470.0" y="412" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" >频道：公告，轮首送达</text><text x="470.0" y="430" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" >私信：紧急，工具返回时送达</text>
<rect x="625" y="362" width="250" height="90" rx="10" fill="#ffffff" stroke="#ca8a04" stroke-width="1.2"/>
<text x="750.0" y="388" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold" >共享上下文 · 记录板</text>
<text x="750.0" y="412" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" >OBSERVED / FACT / FAIL</text><text x="750.0" y="430" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" >CLAIM / PATCH_SUMMARY</text>
<line x1="106.0" y1="318" x2="106.0" y2="208" stroke="#059669" stroke-width="2" marker-end="url(#arG)" stroke-dasharray="6 4"/>
<line x1="292.0" y1="208" x2="292.0" y2="318" stroke="#ea580c" stroke-width="2" marker-end="url(#arO)"/>
<line x1="466.0" y1="318" x2="466.0" y2="208" stroke="#059669" stroke-width="2" marker-end="url(#arG)" stroke-dasharray="6 4"/>
<line x1="490.0" y1="208" x2="490.0" y2="318" stroke="#ea580c" stroke-width="2" marker-end="url(#arO)"/>
<line x1="664.0" y1="318" x2="664.0" y2="208" stroke="#059669" stroke-width="2" marker-end="url(#arG)" stroke-dasharray="6 4"/>
<line x1="850.0" y1="208" x2="850.0" y2="318" stroke="#ea580c" stroke-width="2" marker-end="url(#arO)"/>
<line x1="60" y1="484" x2="92" y2="484" stroke="#059669" stroke-width="2" marker-end="url(#arG)" stroke-dasharray="6 4"/>
<text x="100" y="488" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" >异步读取</text>
<line x1="190" y1="484" x2="222" y2="484" stroke="#ea580c" stroke-width="2" marker-end="url(#arO)"/>
<text x="230" y="488" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" >并发写入</text>
</svg>
